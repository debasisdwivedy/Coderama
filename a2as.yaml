functions:
  __init__:
    type: sync
    module: remote_agent_connection
    args: [self, agent_card, agent_url]
  _async_init_components:
    type: async
    module: coordinator
    args: [self, remote_agent_addresses]
    params:
      returns: None
  before_model_callback:
    type: sync
    module: coordinator
    args: [self, callback_context, llm_request]
  check_active_agent:
    type: sync
    module: coordinator
    args: [self, context]
  convert_part:
    type: sync
    module: coordinator
    args: [part, tool_context]
  convert_parts:
    type: sync
    module: coordinator
    args: [parts, tool_context]
  create:
    type: async
    module: coordinator
    args: [cls, remote_agent_addresses, task_callback]
    params:
      returns: CoordinatorAgent
  create_agent:
    type: sync
    module: coordinator
    args: [self]
    params:
      returns: Agent
  create_send_message_payload:
    type: sync
    module: coordinator
    args: [text, task_id, context_id]
    params:
      returns: dict
  exit_loop:
    type: sync
    module: Develop_Software.software_development_agent
    args: [tool_context]
  get_agent:
    type: sync
    module: remote_agent_connection
    args: [self]
    params:
      returns: AgentCard
  get_current_directory:
    type: async
    module: __main__
  get_policy_decision:
    type: sync
    module: __main__
    args: [policy_response_json]
  get_response_from_agent:
    type: async
    module: __main__
    args: [message, history, provider_dropdown, model_name, api_key, workspace_directory, container_image_tag, timeout, sandbox]
    params:
      returns: AsyncIterator[gr.ChatMessage]
  get_response_from_policy_agent:
    type: async
    module: __main__
    args: [message, history]
    params:
      returns: AsyncIterator[gr.ChatMessage]
  get_workspace:
    type: async
    module: __main__
    args: [file_explorer]
  init_agents:
    type: async
    module: __main__
  initialized_coordinator_agent:
    type: async
    module: coordinator
    params:
      returns: Agent
  list_remote_agents:
    type: sync
    module: coordinator
    args: [self]
  main:
    type: async
    module: __main__
  read_file:
    type: async
    module: __main__
    args: [file_path]
  root_instruction:
    type: sync
    module: coordinator
    args: [self, context]
    params:
      returns: str
  send_message:
    type: async
    module: remote_agent_connection
    args: [self, message_request]
    params:
      returns: SendMessageResponse
  zip_and_download:
    type: sync
    module: __main__

variables:
  DOCKER_IMAGE_TAG:
    type: env
    params:
      caller: [os.environ, os.getenv]
      path: [Requirement_Gathering.requirement_gathering_agent, Project_Planning.project_planning_agent, Develop_Software.software_development_agent]
  GOOGLE_API_KEY:
    type: env
    params:
      caller: [os.getenv, os.environ]
      path: [Policy_Enforcer.policy_enforcement_agent, coordinator, Requirement_Gathering.requirement_gathering_agent, Project_Planning.project_planning_agent,
        Develop_Software.software_development_agent]
  LITE_LLM_TOKEN:
    type: env
    params:
      caller: [os.getenv, LiteLlm, os.environ]
      path: [Policy_Enforcer.policy_enforcement_agent, coordinator, Requirement_Gathering.requirement_gathering_agent, Project_Planning.project_planning_agent,
        Develop_Software.software_development_agent]
  LOGGING_LEVEL:
    type: env
    params:
      caller: [os.getenv, os.environ]
      path: [Develop_Software.__main__, Project_Planning.__main__, Requirement_Gathering.__main__]
  MODEL:
    type: env
    params:
      caller: [os.getenv, os.environ]
      path: [Policy_Enforcer.policy_enforcement_agent, coordinator, Requirement_Gathering.requirement_gathering_agent, Project_Planning.project_planning_agent,
        Develop_Software.software_development_agent]
  PLATFORM:
    type: env
    params:
      caller: [os.environ, os.getenv]
      path: [Requirement_Gathering.requirement_gathering_agent, Project_Planning.project_planning_agent, Develop_Software.software_development_agent]
  PROJECT_PLANNER_AGENT_URL:
    type: env
    params:
      caller: [os.getenv, os.environ]
      path: [coordinator]
  PROVIDER:
    type: env
    params:
      caller: [os.getenv, os.environ]
      path: [Policy_Enforcer.policy_enforcement_agent, coordinator, Requirement_Gathering.requirement_gathering_agent, Project_Planning.project_planning_agent,
        Develop_Software.software_development_agent]
  REQUIREMENT_GATHERING_AGENT_URL:
    type: env
    params:
      caller: [os.getenv, os.environ]
      path: [coordinator]
  SANDBOX_AVAILABLE:
    type: env
    params:
      caller: [os.environ, os.getenv]
      path: [Requirement_Gathering.requirement_gathering_agent, Project_Planning.project_planning_agent, Develop_Software.software_development_agent]
  SOFTWARE_DEVELOPMENT_AGENT_URL:
    type: env
    params:
      caller: [os.getenv, os.environ]
      path: [coordinator]
  TIMEOUT:
    type: env
    params:
      caller: [os.getenv, os.environ]
      path: [coordinator, remote_agent_connection]
  WORKSPACE_DIR:
    type: env
    params:
      caller: [os.getenv, os.environ]
      path: [__main__, Requirement_Gathering.requirement_gathering_agent, Project_Planning.project_planning_agent, Develop_Software.software_development_agent]

files:
  "..":
    type: pattern
    actions: [read]
    params:
      caller: [os.path.join]
      pattern: [current_dir, ".."]
  /tmp:
    type: pattern
    actions: [read]
    params:
      caller: [os.path.join]
      pattern: [/tmp, workspace_directory]
  file_path:
    type: variable
    actions: [read]
    params:
      caller: [os.path.exists, open]
  logs/project_planning.log:
    type: literal
    actions: [write]
    params:
      caller: [open, init_agents]
      alias: [log_file]
  logs/requirement_gathering.log:
    type: literal
    actions: [write]
    params:
      caller: [open, init_agents]
      alias: [log_file]
  logs/software_development.log:
    type: literal
    actions: [write]
    params:
      caller: [open, init_agents]
      alias: [log_file]
  WORKSPACE_DIR:
    type: variable
    actions: [read, delete]
    params:
      caller: [os.path.exists, os.makedirs, os.rmdir, shutil.rmtree, os.mkdir]

processes:
  coderama:
    type: mcp
    actions: [exec]
    params:
      caller: [StdioServerParameters]
      shell: ["False", "False", "False", "False", "False", "False"]
  docker:
    type: shell
    actions: [exec]
    args: [[--version]]
    params:
      caller: [subprocess.run]
      shell: ["False"]
  python:
    type: shell
    actions: [exec]
    args: [[-m, Requirement_Gathering], [-m, Project_Planning], [-m, Develop_Software]]
    params:
      caller: [subprocess.Popen]
      shell: ["False", "False", "False"]
      ref: sys.executable

networks:
  agent_card:
    type: api
    actions: [GET]
    protocols: [http]
    ports: ["80"]
    params:
      caller: [main]
      pattern: http://{host}:{port}
